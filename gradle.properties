org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 ships built-in Kotlin and rejects anything registering sources through
# the kotlin.sourceSets DSL. KSP still does exactly that for its generated
# output (Room's DAOs), so the check has to be relaxed. This is the escape hatch
# AGP itself points at; revisit once KSP registers through android.sourceSets.
android.disallowKotlinSourceSets=false
