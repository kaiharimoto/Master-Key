name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.0.1'
        required: true
      prerelease:
        description: 'Publish as a prerelease (the app ignores prereleases)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        env:
          # Via env, never interpolated straight into the script: an input is
          # attacker-controllable text, and this job holds contents:write plus
          # the signing key.
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$INPUT_VERSION"
          fi
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must be MAJOR.MINOR.PATCH, got '$V'" >&2
            exit 1
          fi
          # Same formula as app/build.gradle.kts and UpdateRepository.kt.
          # If you change it, change it in all three.
          IFS=. read -r MA MI PA <<< "$V"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$(( MA * 10000 + MI * 100 + PA ))" >> "$GITHUB_OUTPUT"

      # Publishing over an existing tag would update that release in place. With
      # the default prerelease=true that silently demotes a published release,
      # and /releases/latest then 404s — every installed app would report "no
      # releases published yet". Refuse instead: versions are immutable.
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
             gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump the version instead of" >&2
            echo "republishing — overwriting it would break the in-app updater." >&2
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew :core:test --no-daemon

      # No signing secrets: the release keystore is committed on purpose.
      # See KEYS.md for why, and for why it must never be regenerated.
      - name: Build signed release APK
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Verify the APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/zipalign" -c -P 16 -v 4 "$APK" | tail -1
          # The in-app updater compares versionCode, so a mismatch between the
          # tag and the APK would silently stop updates from being offered.
          "$BT/aapt2" dump badging "$APK" | head -1

      - name: Name the asset
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             master-key-${{ steps.version.outputs.name }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Master Key ${{ steps.version.outputs.name }}
          files: master-key-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
          # Tag pushes are always real releases. A manual run defaults to a
          # prerelease — /releases/latest ignores those, so the pipeline can be
          # exercised without the installed app seeing it as an update — but can
          # publish a real one when that is what you actually want.
          prerelease: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          # Creates the tag when it does not exist, which makes a dispatched run
          # a complete release path on its own. The step above guarantees it does
          # not exist, so this always points at the commit that was built.
          target_commitish: ${{ github.sha }}
